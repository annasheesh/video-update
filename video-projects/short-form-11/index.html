<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Short Form Video - 11.mp4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Speaker Video & Wrapper */
      #speaker-wrapper {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        transform-origin: 50% 68%;
        will-change: transform;
      }

      .speaker-media {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
        filter: contrast(1.06) saturate(1.08) brightness(1.02);
      }

      /* Subtle corner vignettes and filmic depth */
      .vignette-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.45) 100%);
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-main-root" id="root" data-composition-id="main" data-no-timeline="" data-duration="15.45" data-width="1080" data-height="1920">
      <!-- Track 0: Speaker Base Video in Zoom Wrapper -->
      <div id="speaker-wrapper">
        <video data-hf-id="hf-speaker-vid" id="speakerVid" class="clip speaker-media" src="assets/source_video.mp4" muted playsinline data-start="0" data-duration="15.45" data-track-index="0"></video>
      </div>

      <!-- Subtle vignette for cinematic depth -->
      <div class="vignette-overlay"></div>

      <!-- Track 1: Scene Overlays -->
      <!-- Scene 1: Raw In. Edit Out. (0.0s - 4.2s) -->
      <div data-hf-id="hf-sc1" id="scene1Host" class="clip" data-composition-id="scene1" data-composition-src="compositions/scene1-raw-vs-edit.html" data-start="0" data-duration="4.2" data-track-index="1"></div>

      <!-- Scene 2: Animation Up Here / AI Engine (4.2s - 8.6s) -->
      <div data-hf-id="hf-sc2" id="scene2Host" class="clip" data-composition-id="scene2" data-composition-src="compositions/scene2-ai-animation.html" data-start="4.2" data-duration="4.4" data-track-index="1"></div>

      <!-- Scene 3: Edits By Me: Zero (8.6s - 13.2s) -->
      <div data-hf-id="hf-sc3" id="scene3Host" class="clip" data-composition-id="scene3" data-composition-src="compositions/scene3-automated-edits.html" data-start="8.6" data-duration="4.6" data-track-index="1"></div>

      <!-- Scene 4: 3-Step Blueprint CTA (13.2s - 15.45s) -->
      <div data-hf-id="hf-sc4" id="scene4Host" class="clip" data-composition-id="scene4" data-composition-src="compositions/scene4-how-to-do-it.html" data-start="13.2" data-duration="2.25" data-track-index="1"></div>

      <!-- Track 2: Kinetic Subtitles (0.0s - 15.45s) -->
      <div data-hf-id="hf-captions" id="captionsHost" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="15.45" data-track-index="2" data-track-kind="captions"></div>

      <!-- Track 3: Synchronized Master Audio with Speech, Music & SFX -->
      <audio data-hf-id="hf-audio-master" id="masterAudio" src="assets/master_audio.mp3" data-start="0" data-duration="15.45" data-track-index="3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });

      // Camera Punch-Ins (Hormozi style framing cuts)
      // 0.0s - 1.2s: Base framing (scale: 1.0)
      // 1.2s: Punch-in on "example video"
      mainTl.to("#speaker-wrapper", { scale: 1.07, duration: 0.22, ease: "power2.out" }, 1.20);

      // 4.2s: Snap reset for Scene 2 start
      mainTl.to("#speaker-wrapper", { scale: 1.00, duration: 0.18, ease: "power2.inOut" }, 4.15);

      // 5.5s: Dynamic snap zoom punch-in when she points UP ("animation up here")
      mainTl.to("#speaker-wrapper", { scale: 1.10, duration: 0.24, ease: "back.out(1.5)" }, 5.45);

      // 8.6s: Reset on Scene 3 start
      mainTl.to("#speaker-wrapper", { scale: 1.00, duration: 0.18, ease: "power2.inOut" }, 8.55);

      // 10.0s: Punch-in on "didn't edit on my own"
      mainTl.to("#speaker-wrapper", { scale: 1.08, duration: 0.20, ease: "power2.out" }, 9.95);

      // 13.2s: Reset on Blueprint scene start
      mainTl.to("#speaker-wrapper", { scale: 1.00, duration: 0.18, ease: "power2.inOut" }, 13.15);

      // Pad timeline to full 15.45s
      mainTl.to({}, { duration: 15.45 }, 0);

      window.__timelines["main"] = mainTl;
      mainTl.seek(0);
    </script>
  </body>
</html>

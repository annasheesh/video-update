<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene 2 - Telemetry Stats & 3D AI Gallery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      }
      #scene2-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      /* Sci-Fi HUD Outer Frame (softgirlnocode signature) */
      .hud-outer-frame {
        position: absolute;
        top: 36px;
        left: 50px;
        width: 980px;
        height: 480px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(10, 10, 14, 0.94);
        backdrop-filter: blur(24px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 122, 0, 0.10);
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
      }

      /* HUD Corner Brackets */
      .bracket {
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: rgba(255, 255, 255, 0.5);
        border-style: solid;
        pointer-events: none;
      }
      .bracket-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 28px; }
      .bracket-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 28px; }
      .bracket-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 28px; }
      .bracket-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 28px; }

      /* Top HUD Header Bar */
      .hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .hud-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
      }
      .hud-brand-bracket {
        color: #FF7A00;
        font-weight: 900;
      }

      /* Telemetry Tracker Badge */
      .telemetry-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .telemetry-text {
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.08em;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .telemetry-val {
        color: #00D2FF;
        font-weight: 700;
      }
      .telemetry-val-orange {
        color: #FF7A00;
        font-weight: 700;
      }
      .tracking-bead {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #FF7A00;
        box-shadow: 0 0 16px #FF7A00, 0 0 30px rgba(255, 122, 0, 0.6);
        position: relative;
      }
      .tracking-bead::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 122, 0, 0.5);
      }

      /* Main Stage: 2-Column Split (f012.jpg) */
      .stage-body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 360px;
        gap: 24px;
        position: relative;
      }

      /* Left Column: Heading + Metric Stack */
      .left-stack {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }

      /* Heading: "Animations of editing with AI" */
      .hud-title {
        font-size: 34px;
        font-weight: 800;
        color: #FFFFFF;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .hud-title-orange {
        color: #FF7A00;
        font-weight: 900;
      }
      .hud-title-serif {
        font-family: "Georgia", "Playfair Display", serif;
        font-style: italic;
        color: #E5A93C;
        font-weight: 400;
      }

      /* Metric Rows */
      .metrics-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .metric-item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .metric-bar-orange {
        width: 5px;
        height: 52px;
        background: #FF7A00;
        border-radius: 3px;
        box-shadow: 0 0 14px rgba(255, 122, 0, 0.8);
      }
      .metric-bar-cyan {
        width: 5px;
        height: 52px;
        background: #00D2FF;
        border-radius: 3px;
        box-shadow: 0 0 14px rgba(0, 210, 255, 0.8);
      }
      .metric-bar-gold {
        width: 5px;
        height: 48px;
        background: #E5A93C;
        border-radius: 3px;
        box-shadow: 0 0 14px rgba(229, 169, 60, 0.8);
      }

      .metric-content {
        display: flex;
        flex-direction: column;
      }
      .metric-number {
        font-size: 46px;
        font-weight: 900;
        color: #FFFFFF;
        line-height: 0.95;
        letter-spacing: -0.03em;
      }
      .metric-label {
        font-size: 15px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 0.02em;
        margin-top: 4px;
        text-transform: uppercase;
      }

      /* Right Column: 3D Angled Perspective Gallery (f012.jpg) */
      .gallery-viewport {
        width: 480px;
        height: 350px;
        perspective: 1000px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .gallery-cards-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateY(-22deg) rotateX(6deg);
      }

      /* 3 Floating 3D Cards */
      .gallery-card {
        position: absolute;
        border-radius: 18px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.25);
        background: #14141A;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 210, 255, 0.15);
        display: flex;
        flex-direction: column;
      }

      /* Card 1: Left Background */
      .card-layer-1 {
        width: 170px;
        height: 270px;
        top: 40px;
        left: 20px;
        transform: translateZ(-40px);
        opacity: 0.85;
      }

      /* Card 2: Center Hero */
      .card-layer-2 {
        width: 200px;
        height: 310px;
        top: 20px;
        left: 140px;
        transform: translateZ(50px);
        border: 2.5px solid #FF7A00;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 122, 0, 0.35);
        z-index: 3;
      }

      /* Card 3: Right Foreground */
      .card-layer-3 {
        width: 175px;
        height: 280px;
        top: 50px;
        left: 290px;
        transform: translateZ(10px);
        border: 2px solid #00D2FF;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 210, 255, 0.25);
        z-index: 2;
      }

      .card-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* View Count Badges */
      .card-views-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(10, 10, 14, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        padding: 4px 10px;
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 11px;
        font-weight: 800;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .badge-dot-orange {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #FF7A00;
        box-shadow: 0 0 6px #FF7A00;
      }
      .badge-dot-cyan {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #00D2FF;
        box-shadow: 0 0 6px #00D2FF;
      }

      /* Bottom Ruler Ticks & Play Indicator */
      .hud-bottom-ruler {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.16em;
        position: relative;
      }
      .ruler-marker {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #FF7A00;
        box-shadow: 0 0 10px #FF7A00;
        top: 4px;
        left: 45%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-s2-root" id="scene2-root" data-composition-id="scene2" data-duration="4.4" data-width="1080" data-height="1920">
      <!-- Sci-Fi HUD Outer Frame -->
      <div id="hudFrame" class="hud-outer-frame">
        <!-- Corner Brackets -->
        <div class="bracket bracket-tl"></div>
        <div class="bracket bracket-tr"></div>
        <div class="bracket bracket-bl"></div>
        <div class="bracket bracket-br"></div>

        <!-- Top Header: Brand + Telemetry -->
        <div class="hud-header">
          <div class="hud-brand">
            <span class="hud-brand-bracket">┌</span> SOFTGIRLNOCODE / AI EDIT SUITE
          </div>
          <div class="telemetry-wrap">
            <div class="telemetry-text">
              POS <span id="posVal" class="telemetry-val">1058.4</span> SCL <span class="telemetry-val-orange">142%</span> VEL <span class="telemetry-val">2140 px/s</span>
            </div>
            <div id="trackingBead" class="tracking-bead"></div>
          </div>
        </div>

        <!-- Stage Body: Split Left Stack & Right 3D Perspective Gallery -->
        <div class="stage-body">
          <!-- Left: Headline + Metric Stat Stack -->
          <div class="left-stack">
            <div id="titleWrap" class="hud-title">
              <span class="hud-title-orange">Animations</span> generated with <span class="hud-title-serif">AI</span>
            </div>

            <div class="metrics-group">
              <!-- Metric 1: 50+ short-form videos -->
              <div id="metric1" class="metric-item">
                <div class="metric-bar-orange"></div>
                <div class="metric-content">
                  <div class="metric-number">50+</div>
                  <div class="metric-label">short-form videos</div>
                </div>
              </div>

              <!-- Metric 2: 5M+ short-form views -->
              <div id="metric2" class="metric-item">
                <div class="metric-bar-cyan"></div>
                <div class="metric-content">
                  <div class="metric-number">5M+</div>
                  <div class="metric-label">short-form views</div>
                </div>
              </div>

              <!-- Metric 3: 100% automated with code -->
              <div id="metric3" class="metric-item">
                <div class="metric-bar-gold"></div>
                <div class="metric-content">
                  <div class="metric-number" style="font-size: 38px;">100%</div>
                  <div class="metric-label">automated with code</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right: 3D Angled Perspective Gallery -->
          <div class="gallery-viewport">
            <div id="galleryCards" class="gallery-cards-wrap">
              <!-- Card 1: Aperture Lens -->
              <div id="gCard1" class="gallery-card card-layer-1">
                <img class="card-img" src="../assets/images/ai_gen_lens.jpg" alt="AI Gen Lens">
                <div class="card-views-badge">
                  <div class="badge-dot-cyan"></div>
                  <span>890K</span>
                </div>
              </div>

              <!-- Card 2: Parametric Sculpture (Center Hero) -->
              <div id="gCard2" class="gallery-card card-layer-2">
                <img class="card-img" src="../assets/images/ai_gen_sculpture.jpg" alt="AI Gen Sculpture">
                <div class="card-views-badge">
                  <div class="badge-dot-orange"></div>
                  <span>2.5M</span>
                </div>
              </div>

              <!-- Card 3: Travertine Arches -->
              <div id="gCard3" class="gallery-card card-layer-3">
                <img class="card-img" src="../assets/images/aesthetic_arch.jpg" alt="AI Gen Arch">
                <div class="card-views-badge">
                  <div class="badge-dot-cyan"></div>
                  <span>420K</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom Ruler Ticks -->
        <div class="hud-bottom-ruler">
          <div id="rulerMarker" class="ruler-marker"></div>
          ┴╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵┴
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Frame entrance
      tl.from("#hudFrame", { y: -25, opacity: 0, scale: 0.96, duration: 0.38, ease: "power3.out" }, 0.08);

      // Title & Metrics stagger
      tl.from("#titleWrap", { x: -30, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.18);
      tl.from("#metric1", { x: -25, opacity: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.28);
      tl.from("#metric2", { x: -25, opacity: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.45);
      tl.from("#metric3", { x: -25, opacity: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.62);

      // 3D Angled Gallery entrance
      tl.from("#galleryCards", { 
        rotationY: -45, 
        scale: 0.82, 
        opacity: 0, 
        x: 60, 
        duration: 0.55, 
        ease: "power3.out" 
      }, 0.25);

      tl.from("#gCard1", { y: 30, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.35);
      tl.from("#gCard2", { y: 40, opacity: 0, duration: 0.4, ease: "back.out(1.8)" }, 0.42);
      tl.from("#gCard3", { y: 30, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.50);

      // Subtle 3D floating hover (sinusoidal breathing)
      tl.to("#gCard2", { y: -10, yoyo: true, repeat: 3, duration: 0.6, ease: "sine.inOut" }, 0.85);
      tl.to("#gCard1", { y: 6, yoyo: true, repeat: 3, duration: 0.55, ease: "sine.inOut" }, 0.90);
      tl.to("#gCard3", { y: -6, yoyo: true, repeat: 3, duration: 0.65, ease: "sine.inOut" }, 0.95);

      // Telemetry fluctuation & bead pulse
      tl.to("#trackingBead", { scale: 1.25, yoyo: true, repeat: 6, duration: 0.32, ease: "sine.inOut" }, 0.4);
      tl.set("#posVal", { textContent: "1072.0" }, 1.3);
      tl.set("#posVal", { textContent: "1094.6" }, 2.5);

      // Bottom ruler marker slide
      tl.fromTo("#rulerMarker", { x: -120 }, { x: 120, duration: 3.5, ease: "none" }, 0.4);

      // Exit
      tl.to("#hudFrame", { y: -20, opacity: 0, duration: 0.28, ease: "power2.in" }, 4.12);

      tl.set({}, {}, 4.4);
      window.__timelines["scene2"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene 1 - Raw In. Edit Out.</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      }
      #scene1-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      .scene-content {
        position: absolute;
        top: 36px;
        left: 54px;
        width: 972px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Headline (Direct Ref 1 detail_10.jpg: "Raw in. Edit out.") */
      .headline-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 6px;
      }
      .top-title {
        font-size: 52px;
        font-weight: 800;
        color: #F5F0E8;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 18px rgba(48, 40, 32, 0.95);
      }
      .title-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #A68B65;
        box-shadow: 0 0 16px #A68B65;
      }

      /* Big Pipeline Row: Media Card -> Connector -> Claude Card (Ref 1 Style) */
      .pipeline-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
      }

      /* Left: Big Video Input Media Card (Ref 1 detail_10.jpg) */
      .video-media-card {
        background: rgba(48, 40, 32, 0.94);
        border: 2px solid rgba(200, 185, 166, 0.45);
        border-radius: 26px;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
        box-shadow: 0 24px 50px rgba(48, 40, 32, 0.85);
        backdrop-filter: blur(24px);
        width: 530px;
        height: 175px;
      }

      .video-thumb {
        width: 110px;
        height: 140px;
        border-radius: 16px;
        overflow: hidden;
        border: 2px solid rgba(200, 185, 166, 0.5);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        flex-shrink: 0;
      }
      .video-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-info {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .video-filename {
        font-size: 34px;
        font-weight: 800;
        color: #F5F0E8;
        letter-spacing: -0.01em;
      }
      .video-badge {
        display: inline-flex;
        align-items: center;
        background: #C8B9A6;
        color: #302820;
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.05em;
        width: fit-content;
      }

      /* Animated Connector with Pulse Bead (Ref 1 detail_10.jpg) */
      .connector-wrap {
        flex: 1;
        height: 4px;
        background: rgba(166, 139, 101, 0.45);
        margin: 0 18px;
        position: relative;
        border-radius: 2px;
      }
      .pulse-bead {
        position: absolute;
        top: -8px;
        left: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #F5F0E8;
        box-shadow: 0 0 16px #F5F0E8, 0 0 30px #A68B65;
      }

      /* Right: Claude Star Card (Ref 1 detail_03.jpg & detail_10.jpg) */
      .claude-logo-card {
        width: 155px;
        height: 175px;
        background: #F5F0E8;
        border: 2px solid #A68B65;
        border-radius: 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 24px 50px rgba(48, 40, 32, 0.8), 0 0 35px rgba(166, 139, 101, 0.4);
        flex-shrink: 0;
      }
      .claude-star-icon {
        width: 84px;
        height: 84px;
      }
      .claude-label {
        font-size: 17px;
        font-weight: 800;
        color: #302820;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* Filmstrip Row with Pictures */
      .filmstrip-panel {
        width: 100%;
        background: rgba(48, 40, 32, 0.92);
        border: 2px solid rgba(200, 185, 166, 0.35);
        border-radius: 22px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        backdrop-filter: blur(20px);
        box-shadow: 0 18px 40px rgba(48, 40, 32, 0.7);
      }

      .film-tag {
        font-size: 18px;
        font-weight: 800;
        color: #C8B9A6;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: 140px;
      }

      .thumbs-container {
        display: flex;
        gap: 12px;
        flex: 1;
        overflow: hidden;
      }

      .thumb-card {
        flex: 1;
        height: 80px;
        border-radius: 12px;
        overflow: hidden;
        border: 1.5px solid rgba(200, 185, 166, 0.45);
        position: relative;
        background: #302820;
      }
      .thumb-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .frames-badge {
        background: rgba(166, 139, 101, 0.28);
        border: 1.5px solid rgba(166, 139, 101, 0.7);
        color: #F5F0E8;
        padding: 8px 18px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-s1-root" id="scene1-root" data-composition-id="scene1" data-duration="4.2" data-width="1080" data-height="1920">
      <div class="scene-content">
        <!-- Headline -->
        <div id="headlineWrap" class="headline-wrap">
          <div class="top-title">Raw in. Edit out.</div>
          <div class="title-dot"></div>
        </div>

        <!-- Big Pipeline: Media Card -> Connector -> Big Claude Card -->
        <div id="pipelineRow" class="pipeline-row">
          <!-- Video Input Card -->
          <div id="mediaCard" class="video-media-card">
            <div class="video-thumb">
              <img src="../assets/images/thumb_01.jpg" alt="Source Clip">
            </div>
            <div class="video-info">
              <div class="video-filename">11.mp4</div>
              <div class="video-badge">0:15 RAW</div>
            </div>
          </div>

          <!-- Connector -->
          <div class="connector-wrap">
            <div id="pulseBead" class="pulse-bead"></div>
          </div>

          <!-- Big Claude Card -->
          <div id="claudeCard" class="claude-logo-card">
            <svg class="claude-star-icon" viewBox="0 0 100 100" fill="none">
              <path d="M50 10 L50 90 M10 50 L90 50 M22 22 L78 78 M22 78 L78 22" stroke="#A68B65" stroke-width="14" stroke-linecap="round"/>
            </svg>
            <span class="claude-label">Claude</span>
          </div>
        </div>

        <!-- Big Filmstrip Row with Pictures -->
        <div id="filmstrip" class="filmstrip-panel">
          <div class="film-tag">Raw Footage</div>
          <div class="thumbs-container">
            <div class="thumb-card"><img src="../assets/images/thumb_02.jpg" alt="2"></div>
            <div class="thumb-card"><img src="../assets/images/thumb_03.jpg" alt="3"></div>
            <div class="thumb-card"><img src="../assets/images/thumb_04.jpg" alt="4"></div>
            <div class="thumb-card"><img src="../assets/images/thumb_05.jpg" alt="5"></div>
            <div class="thumb-card"><img src="../assets/images/thumb_06.jpg" alt="6"></div>
          </div>
          <div class="frames-badge">✓ 464 FRAMES</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Entrances
      tl.from("#headlineWrap", { y: -30, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.from("#mediaCard", { x: -50, opacity: 0, scale: 0.94, duration: 0.45, ease: "back.out(1.5)" }, 0.3);
      tl.from("#claudeCard", { x: 50, opacity: 0, scale: 0.8, duration: 0.45, ease: "back.out(1.8)" }, 0.45);
      tl.from("#filmstrip", { y: 30, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.85);

      // Pulse bead travels via transform x
      tl.fromTo("#pulseBead", { x: 0, opacity: 0 }, { x: 200, opacity: 1, duration: 0.6, ease: "power1.inOut" }, 0.5);
      tl.to("#pulseBead", { opacity: 0, duration: 0.1 }, 1.1);

      // Pulse glow on Claude card
      tl.to("#claudeCard", { scale: 1.06, yoyo: true, repeat: 1, duration: 0.25, ease: "power2.out" }, 1.1);

      // Exit
      tl.to(".scene-content", { y: -40, opacity: 0, duration: 0.28, ease: "power2.in" }, 3.9);

      tl.set({}, {}, 4.2);
      window.__timelines["scene1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene 4 - AI Studio Mode & Roadmap Launch</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      }
      #scene4-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      /* Sci-Fi HUD Outer Frame */
      .hud-outer-frame {
        position: absolute;
        top: 36px;
        left: 50px;
        width: 980px;
        height: 480px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(10, 10, 14, 0.94);
        backdrop-filter: blur(24px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 122, 0, 0.12);
        padding: 22px 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }

      /* HUD Corner Brackets */
      .bracket {
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: rgba(255, 255, 255, 0.5);
        border-style: solid;
        pointer-events: none;
      }
      .bracket-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 28px; }
      .bracket-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 28px; }
      .bracket-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 28px; }
      .bracket-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 28px; }

      /* Top Header: Brand + Status */
      .hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .hud-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
      }
      .hud-brand-bracket {
        color: #FF7A00;
        font-weight: 900;
      }
      .pipeline-status {
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 12px;
        font-weight: 800;
        color: #00D2FF;
        letter-spacing: 0.08em;
        background: rgba(0, 210, 255, 0.1);
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid rgba(0, 210, 255, 0.3);
      }

      /* Headline (f045.jpg exact layout) */
      .headline-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: 6px;
      }
      .headline-line1 {
        font-size: 40px;
        font-weight: 900;
        color: #FFFFFF;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .headline-serif-italic {
        font-family: "Georgia", "Playfair Display", serif;
        font-style: italic;
        color: #E5A93C;
        font-weight: 400;
      }
      .headline-orange {
        color: #FF7A00;
        font-weight: 900;
        text-shadow: 0 0 24px rgba(255, 122, 0, 0.6);
      }

      /* The Animated iOS-Style Toggle Switch Pill (f045.jpg) */
      .toggle-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgba(18, 18, 24, 0.96);
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        padding: 12px 30px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 210, 255, 0.2);
        position: relative;
        margin: 10px 0;
      }
      .toggle-label {
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toggle-dot-separator {
        color: #FF7A00;
      }

      /* The iOS Toggle Switch Container */
      .ios-switch-track {
        width: 68px;
        height: 38px;
        background: #3A3A44;
        border-radius: 999px;
        padding: 3px;
        display: flex;
        align-items: center;
        position: relative;
      }
      .ios-switch-thumb {
        width: 32px;
        height: 32px;
        background: #FFFFFF;
        border-radius: 50%;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        position: absolute;
        left: 3px;
      }

      /* Active Switch State */
      .switch-active-glow {
        box-shadow: 0 0 20px rgba(255, 122, 0, 0.9), 0 0 40px rgba(255, 122, 0, 0.5);
      }

      /* Roadmap 3 Station Pills with Connecting Paths (User Roadmap requirement) */
      .roadmap-flow-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0 10px;
        position: relative;
      }
      .flow-station {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 8px 16px;
      }
      .flow-station-active {
        border-color: #FF7A00;
        background: rgba(255, 122, 0, 0.12);
        box-shadow: 0 0 16px rgba(255, 122, 0, 0.25);
      }
      .station-num {
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 13px;
        font-weight: 900;
        color: #FF7A00;
      }
      .station-name {
        font-size: 14px;
        font-weight: 800;
        color: #FFFFFF;
        letter-spacing: -0.01em;
      }
      .flow-arrow {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.4);
        font-weight: 900;
      }
      .flow-arrow-active {
        color: #00D2FF;
        text-shadow: 0 0 10px #00D2FF;
      }

      /* Next Video CTA Banner */
      .cta-banner {
        width: 100%;
        background: linear-gradient(90deg, #FF7A00, #FF5500);
        border-radius: 14px;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #FFFFFF;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.02em;
        box-shadow: 0 8px 24px rgba(255, 122, 0, 0.4);
      }
      .cta-arrow-circle {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #FFFFFF;
        color: #FF7A00;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
      }

      /* Bottom Ruler Ticks */
      .hud-bottom-ruler {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "SF Mono", "Consolas", monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.16em;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-s4-root" id="scene4-root" data-composition-id="scene4" data-duration="2.25" data-width="1080" data-height="1920">
      <!-- Sci-Fi HUD Outer Frame -->
      <div id="hudFrame" class="hud-outer-frame">
        <!-- Corner Brackets -->
        <div class="bracket bracket-tl"></div>
        <div class="bracket bracket-tr"></div>
        <div class="bracket bracket-bl"></div>
        <div class="bracket bracket-br"></div>

        <!-- Top Header Bar -->
        <div class="hud-header">
          <div class="hud-brand">
            <span class="hud-brand-bracket">┌</span> SOFTGIRLNOCODE / AI EDIT SUITE
          </div>
          <div class="pipeline-status">PIPELINE READY</div>
        </div>

        <!-- Main Headline (f045.jpg) -->
        <div id="headline" class="headline-center">
          <div class="headline-line1">
            The pipeline <span class="headline-serif-italic">that</span> sets up
          </div>
          <div class="headline-line1">
            your <span class="headline-orange">AI studio.</span>
          </div>
        </div>

        <!-- The Interactive iOS Toggle Switch Pill (f045.jpg) -->
        <div id="togglePill" class="toggle-pill">
          <div class="toggle-label">
            <span>AI STUDIO MODE</span>
            <span class="toggle-dot-separator">•</span>
            <span id="toggleStateText">OFF</span>
          </div>
          <div id="switchTrack" class="ios-switch-track">
            <div id="switchThumb" class="ios-switch-thumb"></div>
          </div>
        </div>

        <!-- Roadmap Station Flow with Paths -->
        <div class="roadmap-flow-row">
          <div id="st1" class="flow-station">
            <span class="station-num">01</span>
            <span class="station-name">Audio Sync</span>
          </div>
          <div id="arr1" class="flow-arrow">➔</div>
          <div id="st2" class="flow-station">
            <span class="station-num">02</span>
            <span class="station-name">AI Motion</span>
          </div>
          <div id="arr2" class="flow-arrow">➔</div>
          <div id="st3" class="flow-station flow-station-active">
            <span class="station-num">03</span>
            <span class="station-name">4K Headless</span>
          </div>
        </div>

        <!-- Next Video CTA Banner -->
        <div id="ctaBanner" class="cta-banner">
          <span>Next Video: Full Step-by-Step Setup</span>
          <div class="cta-arrow-circle">➔</div>
        </div>

        <!-- Bottom Ruler Ticks -->
        <div class="hud-bottom-ruler">
          ┴╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵┴
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Frame entrance
      tl.from("#hudFrame", { y: -25, opacity: 0, scale: 0.96, duration: 0.35, ease: "power3.out" }, 0.08);

      // Headline entrance
      tl.from("#headline", { y: -20, opacity: 0, duration: 0.32, ease: "power2.out" }, 0.18);

      // Toggle Pill entrance
      tl.from("#togglePill", { scale: 0.9, opacity: 0, duration: 0.35, ease: "back.out(1.8)" }, 0.28);

      // The Snap Toggle ON animation (signature move at 0.65s)
      tl.to("#switchThumb", { x: 30, duration: 0.22, ease: "power2.out" }, 0.65);
      tl.to("#switchTrack", { 
        backgroundColor: "#FF7A00", 
        boxShadow: "0 0 20px rgba(255, 122, 0, 0.9), 0 0 40px rgba(255, 122, 0, 0.5)",
        duration: 0.22,
        ease: "power2.out"
      }, 0.65);
      tl.set("#toggleStateText", { textContent: "ON", color: "#FF7A00" }, 0.72);
      tl.to("#togglePill", { 
        boxShadow: "0 12px 32px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 122, 0, 0.4)", 
        duration: 0.25 
      }, 0.68);

      // Roadmap flow pop
      tl.from(".flow-station", { y: 15, opacity: 0, stagger: 0.08, duration: 0.28, ease: "power2.out" }, 0.85);
      tl.to(["#arr1", "#arr2"], { color: "#00D2FF", duration: 0.2 }, 1.05);

      // CTA Banner slide up
      tl.from("#ctaBanner", { y: 20, opacity: 0, duration: 0.3, ease: "back.out(1.6)" }, 1.15);
      tl.to("#ctaBanner", { scale: 1.02, yoyo: true, repeat: 1, duration: 0.25, ease: "sine.inOut" }, 1.45);

      tl.set({}, {}, 2.25);
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

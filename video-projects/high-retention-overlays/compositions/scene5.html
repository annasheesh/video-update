<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene 5 - Automated Pipeline</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #scene5-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      /* Headline */
      .scene-title {
        position: absolute;
        top: 60px;
        left: 80px;
        font-size: 64px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        letter-spacing: -0.02em;
      }

      /* Flowchart Master Container */
      .pipeline-panel {
        position: absolute;
        top: 150px;
        left: 70px;
        width: 940px;
        height: 330px;
        background: rgba(22, 27, 34, 0.92);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
        backdrop-filter: blur(18px);
      }

      .nodes-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .flow-node {
        width: 240px;
        padding: 16px 12px;
        border-radius: 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .node-blue {
        border: 2px solid #3b82f6;
        background: rgba(59, 130, 246, 0.15);
      }
      .node-purple {
        border: 2px solid #a855f7;
        background: rgba(168, 85, 247, 0.15);
      }
      .node-green {
        border: 2px solid #10b981;
        background: rgba(16, 185, 129, 0.15);
      }

      .node-title {
        font-size: 24px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 0.05em;
      }
      .node-sub {
        font-family: monospace;
        font-size: 18px;
        font-weight: 700;
        color: #cbd5e1;
      }

      .flow-arrow {
        font-size: 36px;
        color: #94a3b8;
        font-weight: 900;
      }

      /* Automated Badge */
      .automated-badge {
        margin-top: 26px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 40px;
        border-radius: 9999px;
        background: #dcfce7;
        border: 2px solid #22c55e;
        color: #15803d;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.08em;
        box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-tidd" id="scene5-root" data-composition-id="scene5" data-duration="3.95" data-width="1080" data-height="1920">
      <div data-hf-id="hf-uxjj" id="s5Title" class="scene-title">Automated Pipeline</div>

      <div data-hf-id="hf-qzbl" id="s5Panel" class="pipeline-panel">
        <div data-hf-id="hf-oxmc" class="nodes-row">
          <div data-hf-id="hf-mczf" id="s5Node1" class="flow-node node-blue">
            <span data-hf-id="hf-ble9" class="node-title">RAW VIDEO</span>
            <span data-hf-id="hf-fc74" class="node-sub">4K 60FPS</span>
          </div>

          <div data-hf-id="hf-bua2" id="s5Arrow1" class="flow-arrow">➔</div>

          <div data-hf-id="hf-6812" id="s5Node2" class="flow-node node-purple">
            <span data-hf-id="hf-v6qv" class="node-title">AI AGENT</span>
            <span data-hf-id="hf-wjek" class="node-sub">HYPERFRAMES</span>
          </div>

          <div data-hf-id="hf-5gg7" id="s5Arrow2" class="flow-arrow">➔</div>

          <div data-hf-id="hf-uxuy" id="s5Node3" class="flow-node node-green">
            <span data-hf-id="hf-e4a9" class="node-title">MASTER VIDEO</span>
            <span data-hf-id="hf-kvr7" class="node-sub">1080x1920</span>
          </div>
        </div>

        <div data-hf-id="hf-8tqj" id="s5Badge" class="automated-badge">
          <span data-hf-id="hf-ls52">✓</span>
          <span data-hf-id="hf-hljp">100% AUTOMATED</span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#s5Title", { opacity: 0, y: -20 });
      gsap.set("#s5Panel", { opacity: 0, scale: 0.9, y: 30 });
      gsap.set("#s5Node1", { opacity: 0, x: -20 });
      gsap.set("#s5Arrow1", { opacity: 0, scale: 0 });
      gsap.set("#s5Node2", { opacity: 0, y: -20 });
      gsap.set("#s5Arrow2", { opacity: 0, scale: 0 });
      gsap.set("#s5Node3", { opacity: 0, x: 20 });
      gsap.set("#s5Badge", { opacity: 0, scale: 0.7 });

      tl.to("#s5Title", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
      tl.to("#s5Panel", { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, 0.15);

      tl.to("#s5Node1", { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.4);
      tl.to("#s5Arrow1", { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.6);
      tl.to("#s5Node2", { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.75);
      tl.to("#s5Arrow2", { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.95);
      tl.to("#s5Node3", { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.1);

      // Shimmer chime accent on 100% AUTOMATED at t=1.8s (overall t=13.3s)
      tl.to("#s5Badge", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.75);
      tl.to("#s5Badge", { scale: 1.05, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);

      // Hold to end of video for confident payoff!
      window.__timelines["scene5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene 2 - This Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #scene2-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      /* Headline */
      .scene-title {
        position: absolute;
        top: 60px;
        left: 80px;
        font-size: 64px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        letter-spacing: -0.02em;
      }

      /* 3D Tilted GitHub Card */
      .gh-card-wrap {
        position: absolute;
        top: 150px;
        left: 80px;
        width: 400px;
        perspective: 900px;
      }
      .gh-card-img {
        width: 100%;
        height: auto;
        border-radius: 24px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 26px 55px rgba(0, 0, 0, 0.65);
        transform: rotateY(-8deg) rotateX(4deg);
      }

      /* GitHub Org Button & Brand */
      .gh-badge-container {
        position: absolute;
        top: 175px;
        left: 520px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .gh-btn-icon {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gh-btn-icon img {
        width: 56px;
        height: 56px;
      }
      .brand-text {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 0.04em;
        color: #ffffff;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
        text-transform: uppercase;
      }

      /* Pointer Glow Accent */
      .pointer-glow {
        position: absolute;
        top: 480px;
        left: 280px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.6) 0%, rgba(59, 130, 246, 0) 70%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-rcqc" id="scene2-root" data-composition-id="scene2" data-duration="3.3" data-width="1080" data-height="1920">
      <div data-hf-id="hf-zqw8" id="s2Title" class="scene-title">This tool</div>

      <div data-hf-id="hf-51iy" id="s2CardWrap" class="gh-card-wrap">
        <img data-hf-id="hf-fu4g" id="s2CardImg" src="../assets/images/test_gh_card.png" alt="GitHub Repo" class="gh-card-img">
      </div>

      <div data-hf-id="hf-zp41" id="s2Badge" class="gh-badge-container">
        <div data-hf-id="hf-nk1y" id="s2Icon" class="gh-btn-icon">
          <img data-hf-id="hf-t5cs" src="../assets/images/test_gh_logo.png" alt="GitHub">
        </div>
        <span data-hf-id="hf-8n1c" id="s2Brand" class="brand-text">HEYGEN-COM</span>
      </div>

      <div data-hf-id="hf-klp5" id="s2Glow" class="pointer-glow"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#s2Title", { opacity: 0, y: -20 });
      gsap.set("#s2CardWrap", { opacity: 0, x: -60, scale: 0.9 });
      gsap.set("#s2Badge", { opacity: 0, x: 40 });
      gsap.set("#s2Glow", { opacity: 0, scale: 0.5 });

      // Entrance
      tl.to("#s2Title", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.to("#s2CardWrap", { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, 0.15);
      tl.to("#s2Badge", { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.35);

      // Accent pulse on speaker finger point (t = 1.3s in this scene, which is t=4.5s overall)
      tl.to("#s2Glow", { opacity: 1, scale: 1.5, duration: 0.4, ease: "power2.out" }, 1.25);
      tl.to("#s2Glow", { opacity: 0, scale: 2.2, duration: 0.5, ease: "power2.in" }, 1.65);
      tl.to("#s2CardWrap", { scale: 1.05, duration: 0.3, ease: "back.out(2)" }, 1.30);
      tl.to("#s2CardWrap", { scale: 1.0, duration: 0.4, ease: "power2.out" }, 1.60);

      // Exit transition
      tl.to(["#s2Title", "#s2CardWrap", "#s2Badge"], {
        opacity: 0,
        y: -30,
        duration: 0.3,
        ease: "power2.in"
      }, 3.0);

      window.__timelines["scene2"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

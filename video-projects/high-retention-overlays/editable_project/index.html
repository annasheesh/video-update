<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>High Retention Animated Video Overlays</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Speaker Video Direct Element */
      .speaker-media {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-yvh0" id="root" data-composition-id="main" data-no-timeline="" data-start="0" data-duration="15.45" data-width="1080" data-height="1920">
      <!-- Track 0: Speaker Base Video -->
      <video data-hf-id="hf-x073" id="speakerVid" class="clip speaker-media" src="assets/source_video.mp4" muted playsinline data-start="0" data-duration="15.45" data-track-index="0"></video>

      <!-- Track 1: Scene Overlays -->
      <!-- Scene 1: Raw In. Edit Out. (0.0s - 3.2s) -->
      <div data-hf-id="hf-uw73" id="scene1Host" class="clip" data-composition-id="scene1" data-composition-src="compositions/scene1.html" data-start="0" data-duration="3.2" data-track-index="1"></div>

      <!-- Scene 2: This Tool (3.2s - 6.5s) -->
      <div data-hf-id="hf-jvdu" id="scene2Host" class="clip" data-composition-id="scene2" data-composition-src="compositions/scene2.html" data-start="3.2" data-duration="3.3" data-track-index="1"></div>

      <!-- Scene 3: Open Source & Free Verification (6.5s - 8.8s) -->
      <div data-hf-id="hf-q4g6" id="scene3Host" class="clip" data-composition-id="scene3" data-composition-src="compositions/scene3.html" data-start="6.5" data-duration="2.3" data-track-index="1"></div>

      <!-- Scene 4: Edits By Me: 0 (8.8s - 11.5s) -->
      <div data-hf-id="hf-raua" id="scene4Host" class="clip" data-composition-id="scene4" data-composition-src="compositions/scene4.html" data-start="8.8" data-duration="2.7" data-track-index="1"></div>

      <!-- Scene 5: Automated Pipeline (11.5s - 15.45s) -->
      <div data-hf-id="hf-igmc" id="scene5Host" class="clip" data-composition-id="scene5" data-composition-src="compositions/scene5.html" data-start="11.5" data-duration="3.95" data-track-index="1"></div>

      <!-- Track 2: Kinetic Subtitles (0.0s - 15.45s) -->
      <div data-hf-id="hf-ticn" id="captionsHost" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="15.45" data-track-index="2" data-track-kind="captions"></div>

      <!-- Track 3: Synchronized Master Audio with Speech & SFX -->
      <audio data-hf-id="hf-puy6" id="masterAudio" src="assets/master_audio.mp3" data-start="0" data-duration="15.45" data-track-index="3"></audio>
    </div>
  </body>
</html>

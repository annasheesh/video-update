<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene 4 - Zero Human Editing</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #scene4-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      /* Headline */
      .scene-title {
        position: absolute;
        top: 60px;
        left: 80px;
        font-size: 64px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
        letter-spacing: -0.02em;
      }

      /* Prohibition / No-Edit Icon */
      .no-edit-icon {
        position: absolute;
        top: 170px;
        left: 120px;
        width: 250px;
        height: 250px;
      }
      .circle-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.6));
      }

      /* Zero Edits Stats */
      .stats-block {
        position: absolute;
        top: 170px;
        left: 480px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .stats-label {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
        text-transform: uppercase;
      }
      .giant-zero {
        font-size: 210px;
        font-weight: 900;
        line-height: 0.9;
        color: #ffffff;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.4);
      }

      /* Highlight Quote */
      .chest-quote {
        position: absolute;
        top: 430px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 46px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
        letter-spacing: -0.01em;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 24px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
      }
      .quote-underline {
        display: inline-block;
        border-bottom: 6px solid #ffffff;
        padding-bottom: 4px;
        margin-right: 12px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-9mzl" id="scene4-root" data-composition-id="scene4" data-duration="2.7" data-width="1080" data-height="1920">
      <div data-hf-id="hf-gglm" id="s4Title" class="scene-title">This entire video</div>

      <div data-hf-id="hf-b5og" id="s4Icon" class="no-edit-icon">
        <svg data-hf-id="hf-tjy5" class="circle-svg" viewBox="0 0 200 200">
          <circle data-hf-id="hf-dggt" cx="100" cy="100" r="85" fill="none" stroke="#ef4444" stroke-width="16" />
          <line data-hf-id="hf-c6gm" x1="40" y1="40" x2="160" y2="160" stroke="#ef4444" stroke-width="16" />
        </svg>
      </div>

      <div data-hf-id="hf-oz0r" id="s4Stats" class="stats-block">
        <span data-hf-id="hf-441i" id="s4Label" class="stats-label">EDITS BY ME</span>
        <span data-hf-id="hf-18em" id="s4Zero" class="giant-zero">0</span>
      </div>

      <div data-hf-id="hf-nxgh" id="s4Quote" class="chest-quote">
        <span data-hf-id="hf-46kh" class="quote-underline">Not</span>
        <span data-hf-id="hf-q12c" class="quote-underline">editing</span>
        <span data-hf-id="hf-4lks" class="quote-underline">anything.</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#s4Title", { opacity: 0, y: -20 });
      gsap.set("#s4Icon", { opacity: 0, scale: 0.6, rotation: -25 });
      gsap.set("#s4Label", { opacity: 0, x: 25 });
      gsap.set("#s4Zero", { opacity: 0, scale: 0.4 });
      gsap.set("#s4Quote", { opacity: 0, y: 30 });

      tl.to("#s4Title", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
      tl.to("#s4Icon", { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.15);
      tl.to("#s4Label", { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.45);

      // Huge stamp on 0 at t=1.2s (overall t=10.0s matching clack SFX)
      tl.to("#s4Zero", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.05);
      tl.to("#s4Quote", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.35);

      // Exit
      tl.to(["#s4Title", "#s4Icon", "#s4Stats", "#s4Quote"], {
        opacity: 0,
        y: -30,
        duration: 0.35,
        ease: "power2.in"
      }, 2.35);

      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
